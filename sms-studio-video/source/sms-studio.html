<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SMS Studio | חברת החשמל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2D3396;
  --blue-2:#242A7E;
  --blue-soft:#F1F3FC;
  --blue-soft-2:#E8ECFA;
  --orange:#E0520B;
  --orange-soft:#FFF3EB;
  --sky:#5F9AE5;
  --ink:#26334A;
  --ink-2:#606B7A;
  --ink-3:#8A93A0;
  --bg:#EEF1F5;
  --surface:#FFF;
  --surface-2:#F8F9FB;
  --border:#D9E0E8;
  --border-2:#C9D2DE;
  --success:#247B55;
  --success-soft:#EAF5EF;
  --danger:#B73A35;
  --danger-soft:#FCEDEC;
  --warn:#9E6407;
  --warn-soft:#FFF4DF;
  --r-lg:12px;
  --r-md:8px;
  --shadow:0 4px 16px rgba(29,40,72,.045);
  --focus:0 0 0 3px rgba(95,154,229,.18);
  --ease:cubic-bezier(.2,.75,.2,1);
  --header-h:68px;
  --context-h:66px;
  --nav-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;max-width:100%;overflow-x:hidden}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Heebo",sans-serif;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:none;box-shadow:var(--focus)
}
svg{display:block}

/* ---------- global header ---------- */
.global-header{
  position:sticky;top:0;z-index:50;
  height:var(--header-h);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 22px;
  background:#FFF;
  border-bottom:0;
}
.global-header::after{
  content:"";position:absolute;right:0;left:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--orange) 0 12%,var(--blue) 12% 100%);
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand img{width:92px;height:46px;object-fit:contain}
.brand-sep{width:1px;height:30px;background:var(--border)}
.brand-copy{min-width:0}
.brand-title{color:var(--blue);font-size:16px;font-weight:700}
.brand-sub{margin-top:1px;color:var(--ink-2);font-size:11px}
.global-actions{display:flex;align-items:center;gap:6px}

/* ---------- contextual header ---------- */
.context-header{
  position:sticky;top:var(--header-h);z-index:42;
  height:var(--context-h);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:0 18px;
  background:#F3F4FB;
  border-bottom:1px solid #CBD3E0;
  box-shadow:0 2px 8px rgba(30,40,72,.035);
}
.context-header::before{
  content:"";align-self:stretch;width:4px;flex:0 0 4px;
  margin-left:2px;background:var(--orange);
}
.document-identity{
  flex:1 1 auto;min-width:0;
  display:flex;align-items:center;gap:9px;
}
.title-input{
  min-width:100px;flex:1 1 auto;border:0;outline:0;background:transparent;
  color:var(--blue);font-size:20px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.serial{
  direction:ltr;unicode-bidi:isolate;flex:0 0 auto;
  color:var(--ink-3);font-size:10.5px;font-weight:500;
}
.autosave{
  flex:0 0 auto;
  display:inline-flex;align-items:center;gap:4px;
  color:var(--ink-3);font-size:10.5px;font-weight:500;
  opacity:0;transform:translateY(2px);
  transition:opacity 140ms var(--ease),transform 140ms var(--ease),color 140ms var(--ease);
  pointer-events:none;
}
.autosave.visible{opacity:1;transform:none}
.autosave.saving{color:var(--blue)}
.autosave.error{color:var(--danger)}
.autosave svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.autosave.saving svg{animation:spin .85s linear infinite}
.context-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}

/* ---------- controls ---------- */
.btn{
  min-height:36px;padding:0 11px;
  border:1px solid transparent;border-radius:var(--r-md);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:11.5px;font-weight:600;background:#FFF;
  transition:background-color 130ms var(--ease),border-color 130ms var(--ease),color 130ms var(--ease),transform 100ms var(--ease);
}
.btn:active,.icon-btn:active{transform:scale(.975)}
.btn svg,.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--blue);color:#FFF}
.btn-primary:hover{background:var(--blue-2)}
.btn-secondary{border-color:var(--border);color:#4F5A6B}
.btn-secondary:hover{background:var(--blue-soft);border-color:#C8CEEA;color:var(--blue)}
.btn-danger{border-color:#E5C7C4;color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-save{
  min-width:78px;border-color:#D6DCE5;background:#F5F6F8;color:#99A0AA;
}
.btn-save:disabled{cursor:default;opacity:.62}
.btn-save.ready:not(:disabled){
  background:#FFF;color:var(--blue);border-color:#B8C3E4;
}
.btn-save.ready:not(:disabled):hover{background:var(--blue-soft)}
.icon-btn{
  width:36px;height:36px;padding:0;border:1px solid var(--border);border-radius:var(--r-md);
  display:grid;place-items:center;background:#FFF;color:var(--blue);
  transition:background-color 130ms var(--ease),border-color 130ms var(--ease),transform 100ms var(--ease);
}
.icon-btn:hover{background:var(--blue-soft);border-color:#C8CEEA}

/* ---------- workbench ---------- */
.workbench{
  display:grid;
  grid-template-columns:250px minmax(420px,1fr) 320px;
  min-height:calc(100vh - var(--header-h) - var(--context-h));
}
.library{
  min-width:0;background:#FFF;border-left:1px solid var(--border);
  display:flex;flex-direction:column;
}
.editor{
  min-width:0;background:var(--bg);border-left:1px solid var(--border);
}
.preview{
  min-width:0;background:#E9EDF3;padding:12px;
}
.pane-titlebar{
  min-height:52px;padding:9px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--border);background:#FFF;
}
.pane-title-wrap{display:flex;align-items:center;gap:9px}
.pane-title-wrap::before{content:"";width:3px;height:22px;border-radius:99px;background:var(--orange)}
.pane-title{color:var(--blue);font-size:14px;font-weight:700}
.pane-meta{color:var(--ink-3);font-size:10px}

/* ---------- library ---------- */
.library-toolbar{padding:11px;border-bottom:1px solid var(--border);background:#FBFCFE}
.new-btn{
  width:100%;min-height:38px;background:var(--orange);color:#FFF;border:0;
}
.new-btn:hover{background:#C94A08}
.search{position:relative;margin-top:9px}
.search input{
  width:100%;height:38px;padding:0 11px 0 34px;
  border:1px solid var(--border);border-radius:var(--r-md);outline:0;background:#FFF;font-size:12px;
}
.search input:focus{border-color:var(--sky);box-shadow:var(--focus)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--blue);stroke-width:1.8}
.tag-filters{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag-filter{
  min-height:25px;padding:0 7px;border:1px solid var(--border);border-radius:999px;
  background:#FFF;color:var(--ink-2);font-size:10px;font-weight:500;
}
.tag-filter.active{background:var(--blue-soft);border-color:#C9CFEC;color:var(--blue)}
.message-list{min-height:0;overflow:auto;padding:7px}
.empty{margin:6px;padding:16px 10px;border:1px dashed var(--border-2);border-radius:8px;text-align:center;color:var(--ink-3);font-size:11px}
.message-item{
  position:relative;margin-bottom:5px;padding:10px 10px 9px;
  border:1px solid transparent;border-radius:8px;background:#FFF;cursor:pointer;
  transition:background-color 130ms var(--ease),border-color 130ms var(--ease);
}
.message-item:hover{background:#F8F9FC;border-color:#E7EAF2}
.message-item.active{background:var(--blue-soft);border-color:#D7DAF2}
.message-item.active::before{
  content:"";position:absolute;right:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)
}
.item-title-row{display:flex;align-items:center;gap:6px;min-width:0}
.item-serial{direction:ltr;color:var(--orange);font-size:9px;font-weight:700;flex:0 0 auto}
.item-title{min-width:0;flex:1;color:var(--blue);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-preview{margin-top:3px;color:var(--ink-2);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.item-tag{max-width:85px;padding:1px 5px 2px;border-radius:999px;background:var(--blue-soft);color:#4A50A4;font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{margin-top:6px;display:flex;justify-content:space-between;gap:8px;color:var(--ink-3);font-size:9.5px}
.library-footer{margin-top:auto;padding:9px 11px;border-top:1px solid var(--border);background:#FAFBFC;color:var(--ink-2);font-size:10px}
.storage-dot{display:inline-block;width:6px;height:6px;margin-left:5px;border-radius:50%;background:#B8BEC8}
.storage-dot.on{background:var(--success)}

/* ---------- editor ---------- */
.editor-scroll{padding:18px 20px 30px}
.editor-inner{max-width:760px;margin:0 auto}
.compose-card{
  overflow:hidden;border:1px solid var(--border);border-radius:var(--r-lg);
  background:#FFF;box-shadow:var(--shadow);
}
.section-head{
  min-height:44px;padding:0 14px;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid #E8ECF0;background:#FBFCFE;
  color:var(--blue);font-size:13px;font-weight:700;
}
.section-head::before{content:"";width:3px;height:18px;border-radius:99px;background:var(--orange)}
.message-input{
  display:block;width:100%;height:170px;min-height:145px;max-height:300px;resize:vertical;
  padding:15px 16px;border:0;outline:0;background:#FFF;
  font-size:15px;line-height:1.75;direction:rtl;text-align:right;unicode-bidi:plaintext;
}
.message-input:focus{box-shadow:inset 0 0 0 2px rgba(95,154,229,.38)}
.input-meta{
  min-height:31px;padding:5px 13px 7px;
  display:flex;justify-content:flex-end;gap:7px;
  border-top:1px solid #F0F2F5;color:var(--ink-3);font-size:10px;
}
.output-card{
  margin-top:14px;overflow:hidden;
  border:1px solid #C9D2E7;border-radius:var(--r-lg);
  background:#F5F7FC;
}
.output-head{
  min-height:50px;padding:7px 10px 7px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid #DCE2EC;background:#EEF2FA;
}
.output-title{color:var(--blue);font-size:13px;font-weight:700}
.output-sub{margin-top:1px;color:var(--ink-3);font-size:10px}
.output-box{
  min-height:88px;max-height:165px;overflow:auto;
  margin:9px;padding:10px 11px;
  border:1px solid #D8DEE8;border-radius:7px;background:#FFF;
  white-space:pre-wrap;overflow-wrap:anywhere;direction:rtl;text-align:right;unicode-bidi:plaintext;
  font-size:12.5px;line-height:1.65;
}
.output-token{direction:ltr;unicode-bidi:isolate;color:var(--blue);font-family:"Heebo",sans-serif;font-weight:700}
.copy-btn{background:var(--blue);color:#FFF;border:0}
.copy-btn:hover{background:var(--blue-2)}

details.meta-card{
  margin-top:14px;overflow:hidden;
  border:1px solid var(--border);border-radius:10px;background:#FFF;
}
details.meta-card summary{
  list-style:none;min-height:42px;padding:0 12px;
  display:flex;align-items:center;justify-content:space-between;
  background:#FAFBFD;color:#596577;font-size:11.5px;font-weight:600;cursor:pointer;
}
details.meta-card summary::-webkit-details-marker{display:none}
details.meta-card[open] summary{border-bottom:1px solid #E5E9EF;color:var(--blue)}
.chev{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;transition:transform 140ms var(--ease)}
details.meta-card[open] .chev{transform:rotate(180deg)}
.meta-body{padding:11px;display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,.7fr);gap:12px}
.meta-label{display:block;margin-bottom:5px;color:#697486;font-size:10.5px;font-weight:600}
.notes-input{width:100%;min-height:82px;resize:vertical;padding:9px 10px;border:1px solid var(--border);border-radius:7px;outline:0;background:#FFF;font-size:12px}
.notes-input:focus,.tag-input:focus{border-color:var(--sky);box-shadow:var(--focus)}
.tag-row{display:flex;gap:4px;margin-bottom:6px}
.tag-input{min-width:0;flex:1;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:7px;outline:0;font-size:11px}
.tag-add{width:30px;height:30px;border:1px solid #D7DAF3;border-radius:7px;background:var(--blue-soft);color:var(--blue);font-size:16px}
.tag-chips{min-height:32px;padding:6px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;border:1px solid #E1E5EC;border-radius:7px;background:#F9FAFC}
.tag-chips:empty::before{content:"ללא תגיות";color:#9AA2AE;font-size:10px}
.tag-chip{min-height:25px;padding:0 7px;display:inline-flex;align-items:center;gap:4px;border:1px solid #D6DAEE;border-radius:999px;background:var(--blue-soft);color:#454B96;font-size:10px;font-weight:500}
.tag-chip button{width:14px;height:14px;padding:0;border:0;background:transparent;color:inherit;line-height:1}

/* ---------- preview ---------- */
.preview-card{
  overflow:hidden;border:1px solid var(--border);border-radius:var(--r-lg);background:#FFF;box-shadow:var(--shadow)
}
.preview-head{
  min-height:50px;padding:8px 10px 8px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:9px;
  border-bottom:1px solid #E8ECF0;
}
.preview-title{display:flex;align-items:center;gap:7px;color:var(--blue);font-size:13px;font-weight:700}
.preview-title::before{content:"";width:3px;height:18px;border-radius:99px;background:var(--orange)}
.preview-actions{display:flex;gap:5px}
.preview-area{min-height:300px;padding:14px;background:#F3F5F8}
.preview-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px;color:var(--ink-2);font-size:10px}
.preview-app{display:flex;align-items:center;gap:6px;color:var(--blue);font-weight:600}
.preview-icon{width:24px;height:24px;border:1px solid #D9DCF0;border-radius:7px;background:#FFF;display:grid;place-items:center}
.preview-icon svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8}
.message-row{display:flex;justify-content:flex-start;direction:rtl}
.sms-bubble{
  max-width:94%;min-width:130px;padding:11px 13px;border-radius:14px 14px 5px 14px;
  background:#DDE7F6;color:#263B5A;white-space:pre-wrap;overflow-wrap:anywhere;
  direction:rtl;text-align:right;unicode-bidi:plaintext;font-size:13.5px;line-height:1.65;
}
.preview-time{margin-top:6px;color:#9299A5;font-size:9px}

/* ---------- drawers / menus ---------- */
.backdrop{
  position:fixed;inset:var(--header-h) 0 0;z-index:60;
  background:rgba(28,35,63,.24);opacity:0;pointer-events:none;
  transition:opacity 160ms var(--ease);
}
.backdrop.open{opacity:1;pointer-events:auto}
.drawer{
  position:absolute;top:0;bottom:0;left:0;width:min(400px,92vw);
  background:#FFF;border-right:1px solid var(--border);box-shadow:0 14px 36px rgba(34,45,78,.14);
  transform:translateX(-101%);transition:transform 190ms var(--ease);display:flex;flex-direction:column;
}
.backdrop.open .drawer{transform:none}
.drawer-head{min-height:52px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.drawer-title{color:var(--blue);font-size:13px;font-weight:700}
.drawer-body{flex:1;overflow:auto;padding:9px}
.version{margin-bottom:6px;padding:9px;border:1px solid var(--border);border-radius:8px;background:#FFF}
.version-top{display:flex;justify-content:space-between;gap:8px}
.version-name{color:var(--blue);font-size:11.5px;font-weight:600}
.version-date{color:var(--ink-3);font-size:9px}
.version-preview{margin-top:4px;color:var(--ink-2);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.version-actions{margin-top:7px;display:flex;gap:5px}
.popover{
  position:fixed;z-index:70;top:58px;left:18px;width:280px;padding:7px;
  border:1px solid var(--border);border-radius:9px;background:#FFF;box-shadow:0 14px 36px rgba(34,45,78,.14);
  opacity:0;transform:translateY(-4px);pointer-events:none;transition:140ms var(--ease);
}
.popover.open{opacity:1;transform:none;pointer-events:auto}
.menu-label{padding:6px 8px 4px;color:var(--ink-3);font-size:9.5px;font-weight:600}
.menu-item{
  width:100%;min-height:36px;padding:0 8px;border:0;border-radius:7px;background:transparent;
  display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink);font-size:11px;font-weight:500;
}
.menu-item:hover{background:var(--blue-soft)}
.menu-item .sub{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-3);font-size:9.5px}
.menu-sep{height:1px;margin:5px 4px;background:var(--border)}
.toast{
  position:fixed;z-index:90;left:50%;bottom:18px;transform:translate(-50%,8px);
  padding:8px 10px;border-radius:7px;background:#30365D;color:#FFF;font-size:10.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:160ms var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}

/* ---------- motion: only meaningful state transitions ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes tagIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.tag-chip{animation:tagIn 150ms var(--ease)}
.message-item,.btn,.icon-btn,.tag-filter{
  transition-duration:130ms;
}

/* ---------- responsive ---------- */
@media(max-width:1199px) and (min-width:900px){
  .workbench{grid-template-columns:205px minmax(360px,1fr) 275px}
  .global-header{padding-inline:14px}
  .context-header{padding-inline:10px}
  .brand img{width:76px}
  .title-input{font-size:17px}
  .context-actions .btn-secondary,
  .context-actions .btn-danger{width:34px;min-width:34px;padding:0}
  .context-actions .btn-secondary span,
  .context-actions .btn-danger span{display:none}
  .editor-scroll{padding:14px}
  .message-input{height:155px;min-height:140px}
  .preview{padding:8px}
  .preview-area{min-height:245px;padding:11px}
  .autosave{display:none}
  .serial{display:none}
}
@media(max-width:899px){
  :root{--header-h:58px;--context-h:56px}
  body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 6px)}
  .global-header{height:var(--header-h);padding:0 10px}
  .brand img{width:60px;height:36px}
  .brand-sep,.brand-sub{display:none}
  .brand-title{font-size:13px}
  .global-actions{gap:4px}
  .context-header{top:var(--header-h);height:var(--context-h);padding:0 8px;gap:6px}
  .context-header::before{width:3px;flex-basis:3px}
  .title-input{font-size:16px}
  .serial,.autosave{display:none}
  .context-actions{gap:4px}
  .context-actions .btn{width:32px;min-width:32px;height:32px;min-height:32px;padding:0}
  .context-actions .btn span{display:none}
  .btn-save{display:grid}
  .workbench{display:block;min-height:0}
  .library,.editor,.preview{display:none;min-height:calc(100vh - var(--header-h) - var(--context-h) - var(--nav-h));border:0}
  body[data-view="library"] .library,
  body[data-view="editor"] .editor,
  body[data-view="preview"] .preview{display:block;animation:viewIn 160ms var(--ease)}
  .message-list{overflow:visible}
  .library-footer{display:none}
  .editor-scroll{padding:10px}
  .editor-inner{max-width:none}
  .message-input{height:205px;min-height:180px;max-height:340px;font-size:16px}
  .meta-body{grid-template-columns:1fr}
  .preview{padding:10px;background:var(--bg)}
  .preview-card{max-width:640px;margin:0 auto}
  .preview-area{min-height:360px}
  .popover{top:52px;left:8px;right:8px;width:auto}
  .backdrop{inset:var(--header-h) 0 0}

<script>
const $=id=>document.getElementById(id);
const state={
  messages:[],currentId:null,dirty:false,activeTag:null,
  autoTimer:null,localTimer:null,hideSaveStateTimer:null,
  dirHandle:null,appDir:null,messagesDir:null,previewsDir:null
};

function uid(){return 'sms_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function now(){return new Date().toISOString()}
function fmtDate(v){return v?new Intl.DateTimeFormat('he-IL',{dateStyle:'short',timeStyle:'short'}).format(new Date(v)):''}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function serial(n){return '#'+String(Number(n)||0).padStart(4,'0')}
function nextSerial(){return state.messages.reduce((m,x)=>Math.max(m,Number(x.serialNumber)||0),0)+1}
function current(){return state.messages.find(m=>m.id===state.currentId)||null}
function normalizeTag(v){return String(v||'').trim().replace(/\s+/g,' ').replace(/^#+/,'').slice(0,30)}
function encodeSms(input){
  return String(input||'').replace(/\r\n?/g,'\n').replace(/\n+/g,run=>{
    const count=run.length;
    return '\n'.repeat(Math.floor(count/2))+(count%2?'\\n':'');
  });
}
function signature(s){
  return JSON.stringify({title:s?.title||'',desiredText:s?.desiredText||'',notes:s?.notes||'',tags:s?.tags||[]});
}

function showToast(msg){
  const el=$('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1300);
}
function showSaveState(mode){
  const el=$('autosave'),label=el.querySelector('span'),icon=el.querySelector('svg');
  clearTimeout(state.hideSaveStateTimer);
  el.className='autosave visible';
  if(mode==='saving'){
    el.classList.add('saving');label.textContent='שומר...';icon.innerHTML='<path d="M12 3a9 9 0 1 0 9 9"/>';return;
  }
  if(mode==='error'){
    el.classList.add('error');label.textContent='שגיאת שמירה';icon.innerHTML='<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 17h.01"/>';return;
  }
  label.textContent='נשמר';icon.innerHTML='<path d="M5 12l4 4L19 6"/>';
  state.hideSaveStateTimer=setTimeout(()=>el.classList.remove('visible'),1050);
}
function updateSaveButton(){
  const b=$('saveBtn');b.disabled=!state.dirty;b.classList.toggle('ready',state.dirty);
}

function snapshotFromEditor(){
  return {
    title:$('titleInput').value.trim()||'ללא שם',
    desiredText:$('messageInput').value,
    encodedText:encodeSms($('messageInput').value),
    notes:$('notesInput').value,
    tags:[...(current()?.tags||[])],
    timestamp:now()
  };
}
function storeDraftInMemory(){
  const m=current();if(!m)return;
  const s=snapshotFromEditor();
  m.title=s.title;m.draft=s;m.draftUpdatedAt=s.timestamp;
}
function saveLocal(){
  localStorage.setItem('smsStudioCleanV1',JSON.stringify({messages:state.messages,currentId:state.currentId}));
}
function debounceLocal(){
  clearTimeout(state.localTimer);state.localTimer=setTimeout(saveLocal,220);
}
function loadLocal(){
  try{
    const raw=localStorage.getItem('smsStudioCleanV1')||localStorage.getItem('smsStudioBrandV4')||localStorage.getItem('smsStudioV3')||localStorage.getItem('smsStudioData');
    if(!raw)return;
    const d=JSON.parse(raw);
    state.messages=Array.isArray(d.messages)?d.messages:[];
    state.currentId=d.currentId||state.messages[0]?.id||null;
    let seq=0;
    state.messages.sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0)).forEach(m=>{
      if(!m.serialNumber)m.serialNumber=++seq; else seq=Math.max(seq,m.serialNumber);
      m.tags=Array.isArray(m.tags)?m.tags:[];
      m.versions=Array.isArray(m.versions)?m.versions:[];
      if(!m.draft&&m.current)m.draft={...m.current,tags:[...(m.tags||[])]};
      if(!m.createdAt)m.createdAt=m.updatedAt||now();
    });
  }catch(e){}
}

/* Stable library: typing never reorders or re-renders the list. */
function renderList(){
  const q=$('searchInput').value.trim().toLowerCase();
  const list=[...state.messages]
    .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))
    .filter(m=>{
      const d=m.draft||m.current||{};
      const hay=((m.title||'')+' '+serial(m.serialNumber)+' '+(m.tags||[]).join(' ')+' '+(d.desiredText||'')+' '+(d.notes||'')).toLowerCase();
      return (!q||hay.includes(q))&&(!state.activeTag||(m.tags||[]).includes(state.activeTag));
    });
  $('messageList').innerHTML='';
  $('messageCount').textContent=state.messages.length+' הודעות';
  if(!list.length){$('messageList').innerHTML='<div class="empty">אין הודעות</div>';return}
  list.forEach(m=>{
    const d=m.draft||m.current||{};
    const el=document.createElement('div');el.className='message-item'+(m.id===state.currentId?' active':'');
    el.dataset.id=m.id;
    el.innerHTML=`<div class="item-title-row"><span class="item-serial">${serial(m.serialNumber)}</span><div class="item-title">${escapeHtml(m.title||'ללא שם')}</div></div>
      <div class="item-preview">${escapeHtml((d.desiredText||'').replace(/\n/g,' '))}</div>
      ${(m.tags||[]).length?`<div class="item-tags">${m.tags.slice(0,3).map(t=>`<span class="item-tag">${escapeHtml(t)}</span>`).join('')}</div>`:''}
      <div class="item-meta"><span>${m.versions.length} גרסאות</span><span>${fmtDate(m.lastSavedAt||m.updatedAt||m.createdAt)}</span></div>`;
    el.onclick=()=>{loadMessage(m.id);if(innerWidth<900)setView('editor')};
    $('messageList').appendChild(el);
  });
}
function updateActiveListItem(){
  const m=current();if(!m)return;
  const el=document.querySelector(`.message-item[data-id="${m.id}"]`);
  if(!el)return;
  el.querySelector('.item-title').textContent=m.title||'ללא שם';
  el.querySelector('.item-preview').textContent=(m.draft?.desiredText||'').replace(/\n/g,' ');
}

function allTags(){
  const map=new Map();
  state.messages.forEach(m=>(m.tags||[]).forEach(t=>map.set(t,(map.get(t)||0)+1)));
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'he'));
}
function renderTagFilters(){
  const wrap=$('tagFilters');wrap.innerHTML='';
  allTags().forEach(([tag,count])=>{
    const b=document.createElement('button');b.className='tag-filter'+(state.activeTag===tag?' active':'');
    b.innerHTML=`${escapeHtml(tag)} <span>${count}</span>`;
    b.onclick=()=>{state.activeTag=state.activeTag===tag?null:tag;renderTagFilters();renderList()};
    wrap.appendChild(b);
  });
}
function renderTags(){
  const m=current(),wrap=$('tagChips');wrap.innerHTML='';
  (m?.tags||[]).forEach(tag=>{
    const c=document.createElement('span');c.className='tag-chip';
    c.innerHTML=`<span>${escapeHtml(tag)}</span><button aria-label="הסרת תגית">×</button>`;
    c.querySelector('button').onclick=()=>{
      m.tags=m.tags.filter(t=>t!==tag);markDirty();renderTags();renderTagFilters();scheduleAutosave();
    };
    wrap.appendChild(c);
  });
}

function renderOutput(){
  const box=$('outputBox'),v=encodeSms($('messageInput').value);
  box.innerHTML='';
  if(!v){box.textContent='—';return}
  v.split(/(\\n)/g).forEach(p=>{
    if(p==='\\n'){const x=document.createElement('bdi');x.dir='ltr';x.className='output-token';x.textContent='\\n';box.appendChild(x)}
    else box.appendChild(document.createTextNode(p));
  });
}
function updateLiveUI(){
  const t=$('messageInput').value;
  $('charCount').textContent=t.length+' תווים';
  $('lineCount').textContent=(t?t.split(/\r\n?|\n/).length:0)+' שורות';
  $('previewCount').textContent=t.length+' תווים';
  $('smsPreview').textContent=t||'ההודעה תופיע כאן';
  renderOutput();
}
function markDirty(){
  state.dirty=true;updateSaveButton();storeDraftInMemory();debounceLocal();updateActiveListItem();
}
function scheduleAutosave(){
  clearTimeout(state.autoTimer);state.autoTimer=setTimeout(()=>persistCurrent(false),1200);
}
async function persistCurrent(manual=false){
  const m=current();if(!m||!state.dirty)return;
  clearTimeout(state.autoTimer);showSaveState('saving');
  storeDraftInMemory();
  const snap={...m.draft,tags:[...(m.tags||[])],timestamp:now(),versionId:uid()};
  const last=m.versions[m.versions.length-1];
  if(!last||signature(last)!==signature(snap)){
    /* Autosave versions are throttled: explicit save always versions; autosave versions max every 5 min. */
    const lastV=new Date(last?.timestamp||0).getTime();
    if(manual||!last||Date.now()-lastV>300000)m.versions.push({...snap});
  }
  m.current={...snap};m.draft={...snap};m.updatedAt=snap.timestamp;m.lastSavedAt=snap.timestamp;
  try{
    saveLocal();if(state.appDir)await writeMessageFile(m);
    state.dirty=false;updateSaveButton();showSaveState('saved');renderVersions();updateActiveListItem();
    if(manual)showToast('נשמר');
  }catch(e){showSaveState('error');if(manual)showToast('השמירה נכשלה')}
}
function loadMessage(id){
  const m=state.messages.find(x=>x.id===id);if(!m)return;
  state.currentId=id;
  const d=m.draft||m.current||{};
  $('titleInput').value=d.title||m.title||'';
  $('messageInput').value=d.desiredText||'';
  $('notesInput').value=d.notes||'';
  $('serial').textContent=serial(m.serialNumber);
  state.dirty=false;updateSaveButton();updateLiveUI();renderTags();renderVersions();renderList();saveLocal();
}
function newMessage(){
  const ts=now(),m={id:uid(),serialNumber:nextSerial(),title:'הודעה חדשה',tags:[],createdAt:ts,updatedAt:ts,lastSavedAt:null,current:null,draft:{title:'הודעה חדשה',desiredText:'',encodedText:'',notes:'',tags:[],timestamp:ts},versions:[]};
  state.messages.unshift(m);state.currentId=m.id;loadMessage(m.id);state.dirty=true;updateSaveButton();$('messageInput').focus();
}
function duplicateCurrent(){
  const m=current();if(!m)return;
  storeDraftInMemory();
  const ts=now(),d={...m.draft,title:(m.title||'הודעה')+' — עותק',timestamp:ts,tags:[...(m.tags||[])]};
  const c={id:uid(),serialNumber:nextSerial(),title:d.title,tags:[...(m.tags||[])],createdAt:ts,updatedAt:ts,lastSavedAt:null,current:null,draft:d,versions:[]};
  state.messages.unshift(c);state.currentId=c.id;loadMessage(c.id);state.dirty=true;updateSaveButton();
}
async function deleteCurrent(){
  const m=current();if(!m)return;
  if(!confirm(`מחיקת "${m.title}"?`))return;
  state.messages=state.messages.filter(x=>x.id!==m.id);
  if(state.messagesDir){try{await state.messagesDir.removeEntry(m.id+'.json')}catch(e){}}
  state.currentId=state.messages[0]?.id||null;saveLocal();
  if(state.currentId)loadMessage(state.currentId);else newMessage();
  showToast('ההודעה נמחקה');
}
function renderVersions(){
  const m=current(),wrap=$('versionList');wrap.innerHTML='';
  if(!m||!m.versions.length){wrap.innerHTML='<div class="empty">אין גרסאות</div>';return}
  [...m.versions].reverse().forEach((v,i)=>{
    const n=m.versions.length-i,el=document.createElement('div');el.className='version';
    el.innerHTML=`<div class="version-top"><div class="version-name">גרסה ${n}</div><div class="version-date">${fmtDate(v.timestamp)}</div></div>
      <div class="version-preview">${escapeHtml((v.desiredText||'').replace(/\n/g,' '))}</div>
      <div class="version-actions"><button class="btn btn-secondary" data-open>פתיחה לעריכה</button><button class="btn btn-secondary" data-copy>העתקת נוסח</button></div>`;
    el.querySelector('[data-open]').onclick=()=>{
      m.draft={...v,tags:[...(v.tags||m.tags||[])]};m.tags=[...(m.draft.tags||[])];
      $('titleInput').value=m.draft.title||m.title;$('messageInput').value=m.draft.desiredText||'';$('notesInput').value=m.draft.notes||'';
      state.dirty=true;updateSaveButton();updateLiveUI();renderTags();closeHistory();scheduleAutosave();
    };
    el.querySelector('[data-copy]').onclick=()=>copyText(v.desiredText||'','ההעתקה הושלמה');
    wrap.appendChild(el);
  });
}
function addTag(){
  const m=current();if(!m)return;
  const t=normalizeTag($('tagInput').value);if(!t)return;
  if(!m.tags.some(x=>x.toLowerCase()===t.toLowerCase())){m.tags.push(t);markDirty();renderTags();renderTagFilters();scheduleAutosave()}
  $('tagInput').value='';
}

/* ---------- file system ---------- */
async function chooseFolder(){
  if(!window.showDirectoryPicker){alert('שמירה ישירה לתיקייה זמינה ב-Chrome וב-Edge.');return}
  try{
    state.dirHandle=await window.showDirectoryPicker({mode:'readwrite'});await setupDirs();await persistHandle(state.dirHandle);updateStorage();await syncFolder();toggleSettings(false);showToast('התיקייה חוברה')
  }catch(e){}
}
async function setupDirs(){
  if(!state.dirHandle)return;
  state.appDir=await state.dirHandle.getDirectoryHandle('SMS-Studio',{create:true});
  state.messagesDir=await state.appDir.getDirectoryHandle('messages',{create:true});
  state.previewsDir=await state.appDir.getDirectoryHandle('previews',{create:true});
}
async function writeJson(handle,obj){const w=await handle.createWritable();await w.write(JSON.stringify(obj,null,2));await w.close()}
async function writeMessageFile(m){if(!state.messagesDir)return;const f=await state.messagesDir.getFileHandle(m.id+'.json',{create:true});await writeJson(f,m);await writeIndex()}
async function writeIndex(){if(!state.appDir)return;const f=await state.appDir.getFileHandle('index.json',{create:true});await writeJson(f,{schemaVersion:5,updatedAt:now(),messages:state.messages.map(m=>({id:m.id,serialNumber:m.serialNumber,title:m.title,tags:m.tags,updatedAt:m.updatedAt}))})}
async function syncFolder(){if(!state.appDir){showToast('נדרשת בחירת תיקייה');return}for(const m of state.messages)await writeMessageFile(m);updateStorage();showToast('הסנכרון הושלם')}
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open('smsStudioDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function persistHandle(h){try{const db=await openDb(),tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(h,'dirHandle');await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function restoreHandle(){try{const db=await openDb(),tx=db.transaction('kv','readonly'),r=tx.objectStore('kv').get('dirHandle');const h=await new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(!h)return;state.dirHandle=h;if(await h.queryPermission({mode:'readwrite'})==='granted')await setupDirs();updateStorage()}catch(e){}}
function updateStorage(){if(state.dirHandle){$('storageDot').classList.add('on');$('storageName').textContent=state.dirHandle.name;$('folderLabel').textContent=state.dirHandle.name}else{$('storageDot').classList.remove('on');$('storageName').textContent='בדפדפן';$('folderLabel').textContent='לא נבחרה'}}

/* ---------- image export ---------- */
function rr(ctx,x,y,w,h,r){const q=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+q,y);ctx.arcTo(x+w,y,x+w,y+h,q);ctx.arcTo(x+w,y+h,x,y+h,q);ctx.arcTo(x,y+h,x,y,q);ctx.arcTo(x,y,x+w,y,q);ctx.closePath()}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function wrapText(ctx,text,maxWidth){
  const rows=[];for(const p of String(text||'').replace(/\r\n?/g,'\n').split('\n')){
    if(p===''){rows.push('');continue}let line='';for(const word of p.split(/\s+/)){const t=line?line+' '+word:word;if(line&&ctx.measureText(t).width>maxWidth){rows.push(line);line=word}else line=t}rows.push(line)
  }return rows
}

function slug(s){return (s||'SMS').normalize('NFKD').replace(/[^\u0590-\u05FF\w\s-]/g,'').trim().replace(/\s+/g,'_').slice(0,60)||'SMS'}
async function saveImage(){
  const b=await makePng(),m=current(),name=`${String(m?.serialNumber||0).padStart(4,'0')}_${slug($('titleInput').value)}_${new Date().toISOString().slice(0,10)}.png`;
  if(state.previewsDir){const f=await state.previewsDir.getFileHandle(name,{create:true}),w=await f.createWritable();await w.write(b);await w.close()}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}showToast('התמונה נשמרה')
}
async function copyImage(){try{const b=await makePng();if(!navigator.clipboard||typeof ClipboardItem==='undefined')throw new Error();await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);showToast('התמונה הועתקה')}catch(e){showToast('העתקת תמונה אינה זמינה')}}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}showToast(msg)}

/* ---------- backup ---------- */
function exportBackup(){const b=new Blob([JSON.stringify({schemaVersion:5,exportedAt:now(),messages:state.messages},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='SMS-Studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toggleSettings(false);showToast('הגיבוי נשמר')}
async function importBackup(file){try{const d=JSON.parse(await file.text());if(!Array.isArray(d.messages))throw new Error();const by=new Map(state.messages.map(m=>[m.id,m]));d.messages.forEach(m=>{m.tags=Array.isArray(m.tags)?m.tags:[];m.versions=Array.isArray(m.versions)?m.versions:[];by.set(m.id,m)});state.messages=[...by.values()];state.currentId=state.currentId||state.messages[0]?.id;saveLocal();renderList();renderTagFilters();if(state.currentId)loadMessage(state.currentId);toggleSettings(false);showToast('ייבוא הגיבוי הושלם')}catch(e){alert('קובץ הגיבוי אינו תקין.')}}

/* ---------- overlays ---------- */
function openHistory(){$('historyBackdrop').classList.add('open');renderVersions()}
function closeHistory(){$('historyBackdrop').classList.remove('open')}
function toggleSettings(force){const p=$('settingsPopover'),open=force!==undefined?force:!p.classList.contains('open');p.classList.toggle('open',open)}

/* ---------- mobile ---------- */
function setView(v){document.body.dataset.view=v;document.querySelectorAll('.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(innerWidth<900)scrollTo({top:0,behavior:'smooth'})}

/* ---------- events ---------- */
['titleInput','messageInput','notesInput'].forEach(id=>{
  $(id).addEventListener('input',()=>{
    updateLiveUI();markDirty();scheduleAutosave();
  });
});
$('searchInput').oninput=renderList;
$('addTagBtn').onclick=addTag;
$('tagInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTag()}});
$('newBtn').onclick=()=>{newMessage();if(innerWidth<900)setView('editor')};
$('saveBtn').onclick=()=>persistCurrent(true);
$('duplicateBtn').onclick=duplicateCurrent;
$('deleteBtn').onclick=deleteCurrent;
$('historyBtn').onclick=openHistory;
$('closeHistory').onclick=closeHistory;
$('historyBackdrop').onclick=e=>{if(e.target===$('historyBackdrop'))closeHistory()};
$('settingsBtn').onclick=e=>{e.stopPropagation();toggleSettings()};
$('settingsPopover').onclick=e=>e.stopPropagation();
document.addEventListener('click',e=>{if(!$('settingsPopover').contains(e.target)&&e.target!==$('settingsBtn'))toggleSettings(false)});
$('copyOutputBtn').onclick=async()=>{await copyText(encodeSms($('messageInput').value),'ההעתקה הושלמה');const b=$('copyOutputBtn'),old=b.innerHTML;b.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg>הועתק';setTimeout(()=>b.innerHTML=old,900)};
$('saveImageBtn').onclick=saveImage;
$('copyImageBtn').onclick=copyImage;
$('chooseFolderBtn').onclick=chooseFolder;
$('syncBtn').onclick=syncFolder;
$('exportBtn').onclick=exportBackup;
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''};
document.querySelectorAll('.mobile-nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();persistCurrent(true)}if(e.key==='Escape'){closeHistory();toggleSettings(false)}});


function updatePhoneClock(){
  const el=document.getElementById('phoneClock');
  if(!el) return;
  const d=new Date();
  el.textContent=new Intl.DateTimeFormat('he-IL',{
    hour:'2-digit',
    minute:'2-digit',
    hour12:false
  }).format(d);
}
updatePhoneClock();
setInterval(updatePhoneClock,1000);

(async function init(){
  loadLocal();
  if(!state.messages.length)newMessage();
  else loadMessage(state.currentId||state.messages[0].id);
  renderTagFilters();
  await restoreHandle();
})();
</script>
